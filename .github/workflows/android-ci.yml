name: RadioDroid CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
  page_build:
  release:
    types:
      - created

jobs:
  test:
    name: Run Tests & Static Analysis
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 21
    - name: Run Tests & Lint
      run: bash ./gradlew lintFreeDebug testFreeDebugUnitTest assembleDebug --stacktrace
    - name: Upload Debug APK
      uses: actions/upload-artifact@v6
      with:
        name: debug-apk
        path: app/build/outputs/apk/free/debug/*.apk
        retention-days: 30
    - name: Upload Lint Reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: lint-reports
        path: app/build/reports/lint-results*
        retention-days: 14
